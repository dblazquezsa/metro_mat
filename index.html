<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Caja de herramientas para la nivelación en pensamiento matemático: un plano de estaciones con explicaciones, exploraciones, retos y retroalimentación.">
<title>Caja de herramientas matemáticas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&family=Overpass+Mono:wght@400;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <span class="eyebrow">Nivelación en pensamiento matemático</span>
      <h1>Caja de herramientas</h1>
    </div>
    <div class="who" id="who" hidden>
      <div class="prog" id="prog" aria-live="polite"></div>
      <nav class="tabs" aria-label="Secciones">
        <button class="btn" id="tab-map" aria-current="page">Plano</button>
        <button class="btn" id="tab-me">Mi progreso</button>
        <button class="btn" id="tab-panel" hidden>Panel del grupo</button>
        <button class="btn ghost" id="tab-out">Salir</button>
      </nav>
    </div>
  </header>
  <div id="notice" class="notice" hidden></div>

  <section id="view-map" hidden>
    <div class="mapcard">
      <div class="maphead">
        <h2 id="greet">Elige una estación</h2>
        <span class="tip">Toca una estación para viajar. Las grises aún están en construcción.</span>
      </div>
      <div class="mapscroll"><svg id="map" viewBox="0 0 1100 640" role="img" aria-label="Plano de líneas y estaciones de aprendizaje"></svg></div>
    </div>
  </section>

  <section id="view-node" hidden></section>
  <section id="view-me" hidden></section>
  <section id="view-panel" hidden></section>
  <section id="view-auth"><p class="muted">Abriendo la caja de herramientas…</p></section>
</div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/base.js"></script>
<script src="js/lineas/enteros.js"></script>
<script src="js/lineas/racionales.js"></script>
<script src="js/bienestar.js"></script>
<script src="js/app.js"></script>
</body>
</html>
